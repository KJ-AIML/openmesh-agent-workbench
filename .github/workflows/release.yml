name: Release

# Builds native OpenMesh desktop installers (macOS .dmg, Windows .msi/.exe,
# Linux .deb/.AppImage) with tauri-action and attaches them to a GitHub
# Release.
#
# Triggers:
#   1. Pushing a tag matching `v*` — builds installers and creates/updates
#      the release for that tag.
#   2. Manual `workflow_dispatch` with a `tag` input — rebuilds installers
#      for an *existing* tag/release (used when a release was published
#      before this workflow existed, or to re-run a failed platform).
#
# Code signing (current state):
#   This repo does not yet provide Apple Developer ID or Windows Authenticode
#   secrets, so installers are built unsigned / ad-hoc. macOS users must clear
#   Gatekeeper quarantine (see release body + scripts/macos-unquarantine.sh).
#   Windows users may see SmartScreen.
#
# When Apple / Windows certs are available, add these GitHub Actions secrets
# (tauri-action / Tauri bundler read them from the env block below):
#   macOS sign + notarize:
#     APPLE_CERTIFICATE          — base64 .p12 Developer ID Application cert
#     APPLE_CERTIFICATE_PASSWORD — password for that .p12
#     APPLE_SIGNING_IDENTITY     — e.g. "Developer ID Application: … (TEAMID)"
#     APPLE_ID                   — Apple ID email for notarytool
#     APPLE_PASSWORD             — app-specific password (not the account password)
#     APPLE_TEAM_ID              — 10-char Team ID
#   Also flip src-tauri/tauri.conf.json bundle.macOS:
#     signingIdentity → remove "-" (or leave unset; APPLE_SIGNING_IDENTITY wins)
#     hardenedRuntime → true  (required for notarization)
#   Windows Authenticode (optional):
#     WINDOWS_CERTIFICATE
#     WINDOWS_CERTIFICATE_PASSWORD
#
# Asset arch matrix (pick the right macOS DMG):
#   OpenMesh_*_aarch64.dmg  — Apple Silicon (M1/M2/M3/M4…)
#   OpenMesh_*_x64.dmg      — Intel Macs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build installers for, e.g. v0.1.24. Leave empty to use the ref the workflow was run on.'
        required: false
        default: ''

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (M1 and above)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only used on macOS runners so it's conditional to slightly speed up windows/linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install frontend dependencies
        run: npm ci

      # Prepend Gatekeeper / arch picker notes on tag-push releases only.
      # workflow_dispatch backfills must not overwrite hand-written release bodies.
      - name: prepare release body
        id: release_notes
        if: github.event_name == 'push'
        run: |
          {
            echo 'body<<EOF'
            cat .github/release-install-notes.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Present but empty until repo secrets are configured — no-op for unsigned builds.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          # releaseName/generateReleaseNotes/releaseBody are ONLY passed on a
          # real `v*` tag push, where tauri-action creates a brand-new release.
          # On manual workflow_dispatch backfill, leave them empty so hand-written
          # release title/notes are not clobbered — assets still upload.
          releaseName: ${{ github.event_name == 'push' && format('OpenMesh {0}', github.ref_name) || '' }}
          generateReleaseNotes: ${{ github.event_name == 'push' }}
          releaseBody: ${{ github.event_name == 'push' && steps.release_notes.outputs.body || '' }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
