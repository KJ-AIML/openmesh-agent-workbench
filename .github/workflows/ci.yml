name: CI

# PR / main quality gate. Installer packaging lives in release.yml and is
# not part of this workflow.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: frontend verify + IPC contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck, lint, unit tests
        run: npm run verify
      - name: IPC contract (invoke vs generate_handler)
        run: npm run check:ipc
      - name: release.yml secret mapping guard
        run: npm run check:release-workflow

  rust:
    name: rust fmt + check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libjavascriptcoregtk-4.1-dev
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace --no-fail-fast
