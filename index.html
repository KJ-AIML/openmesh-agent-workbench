<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenMesh · Usage Dashboard</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/logo.svg"
    />
    <!-- Apply cached appearance before first paint to avoid theme flash. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("openmesh.appearance");
          var a = raw ? JSON.parse(raw) : null;
          var theme = (a && a.theme) || "dark";
          var fontSize = (a && a.fontSize) || "medium";
          var density = (a && a.density) || "comfortable";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", !!dark);
          root.dataset.theme = dark ? "dark" : "light";
          root.dataset.fontSize = fontSize;
          root.dataset.density = density;
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
